[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amem-reproduction"
version = "0.1.0"
description = "Reproduction of A-Mem: Agentic Memory for LLM Agents (Xu et al., 2025), using NVIDIA NIM."
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "openai>=1.0",
    "numpy>=1.24",
    "sentence-transformers>=2.2.2",
    "chromadb>=0.4.22",
    "rank_bm25>=0.2.2",
    "nltk>=3.8.1",
]
