[project]
name = "amem-reproduction"
version = "0.1.0"
description = "Reproduction of A-Mem: Agentic Memory for LLM Agents (Xu et al., 2025), using NVIDIA NIM."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "sentence-transformers>=2.2.2",
    "chromadb>=0.4.22",
    "rank_bm25>=0.2.2",
    "nltk>=3.8.1",
    "pyvis>=0.3.2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyter>=1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["experiments"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
